name: CI Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check & unit tests (no secrets, offline mocked)
        run: |
          python3 -m py_compile radar.py dashboard.py
          bash -n deploy/ubuntu/install.sh
          python3 -m unittest discover -s tests -v
